<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Barca</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="app-header">
    <button id="menu-btn" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><rect y="3" width="20" height="2" rx="1"/><rect y="9" width="20" height="2" rx="1"/><rect y="15" width="20" height="2" rx="1"/></svg>
    </button>
    <h1>Barca</h1>
    <div id="header-spacer"></div>
  </header>

  <main>
    <section id="tab-now" class="tab-panel active"></section>
    <section id="tab-timeline" class="tab-panel"></section>
    <section id="tab-map" class="tab-panel"></section>
    <section id="tab-wallet" class="tab-panel"></section>
    <section id="tab-weather" class="tab-panel"></section>
  </main>

  <nav id="tab-bar">
    <button data-tab="now" class="active">Now</button>
    <button data-tab="timeline">Timeline</button>
    <button data-tab="map">Map</button>
    <button data-tab="wallet">Wallet</button>
    <button data-tab="weather">Weather</button>
  </nav>

  <div id="detail-overlay" class="overlay hidden"></div>

  <div id="menu-drawer" class="overlay hidden">
    <div class="drawer-sheet">
      <button data-menu="checklist" class="drawer-item">Checklist</button>
      <button data-menu="phrases" class="drawer-item">Useful phrases</button>
      <button data-menu="emergency" class="drawer-item">Emergency info</button>
      <button data-menu="download" class="drawer-item" id="download-tiles-btn">Download map for offline</button>
      <hr>
      <button data-menu="lang" class="drawer-item">Limba romana</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
